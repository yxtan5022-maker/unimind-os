[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umos"
version = "0.2.0"
description = "UniMind - a user-space quantum-classical middleware research prototype"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.scripts]
umos-demo = "umos_py.demo:main"
umos-desktop = "gui.app:main"
umos-mcp = "bridge.hermes.mcp_server:main"
umos-healer = "bridge.healer:main"
umos-cluster = "bridge.distributed.node:main"
umos-iep = "bridge.iep.dispatcher:main"

[project.optional-dependencies]
quantum = ["qiskit>=1.0.0"]
cudaq = ["cudaq"]
hw = ["psutil>=5.9.0"]
dev = ["pytest>=8.0.0"]
all = ["umos[quantum]", "umos[cudaq]", "umos[hw]", "pytest"]

[tool.setuptools.packages.find]
include = ["umos_py*", "bridge*", "quantum*", "gui*"]
