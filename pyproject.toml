[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umos"
version = "0.1.0"
description = "UniMind OS (UMOS) - The World's First AI Native Operating System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
umos-demo = "umos_py.demo:main"

[tool.setuptools.packages.find]
include = ["umos_py*"]
